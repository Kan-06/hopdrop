<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopDrop | Sign In</title>
    <meta name="description" content="Sign in to HopDrop — Next-Generation Peer-to-Peer Delivery Platform">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="animated-bg">
        <div class="orb orb-pink"></div>
        <div class="orb orb-blue"></div>
        <div class="orb orb-yellow"></div>
    </div>

    <div class="container glass-panel auth-panel">
        <header>
            <h1 class="logo">Hop<span>Drop</span></h1>
            <p class="subtitle">Next-Generation Peer-to-Peer Delivery</p>
        </header>

        <div class="google-auth-container">
            <div class="auth-divider-text">Welcome! Sign in to continue</div>

            <div class="google-btn-wrapper">
                <!-- Google One Tap & rendered button target -->
                <div id="google-signin-btn"></div>
            </div>

            <p class="auth-note">
                New users are automatically registered on first sign-in.<br>
                Your Google account keeps your data secure.
            </p>

            <div class="form-message hidden" id="auth-msg"></div>
        </div>
    </div>

    <!-- Hidden Google One Tap trigger -->
    <div id="g_id_onload"
         data-client_id="152151082369-pmf3e6sl3tgdqj8ku3r5n7rb5anc16cl.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleCredential"
         data-auto_prompt="false">
    </div>

    <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopDrop | Sign In</title>
    <meta name="description" content="Sign in to HopDrop — Next-Generation Peer-to-Peer Delivery Platform">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="animated-bg">
        <div class="orb orb-pink"></div>
        <div class="orb orb-blue"></div>
        <div class="orb orb-yellow"></div>
    </div>

    <div class="container glass-panel auth-panel">
        <header>
            <h1 class="logo">Hop<span>Drop</span></h1>
            <p class="subtitle">Next-Generation Peer-to-Peer Delivery</p>
        </header>

        <div class="google-auth-container">
            <div class="auth-divider-text">Welcome! Sign in to continue</div>

        <div class="auth-forms-container">
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to access your dashboard.</p>
                </div>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <div class="form-message hidden" id="login-msg"></div>
                <button type="submit" class="primary-btn">Sign In</button>
                
                <div class="divider"><span>OR</span></div>
                
                <button type="button" class="google-btn" id="google-login">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google logo">
                    Sign in with Google
                </button>
            </form>

            <p class="auth-note">
                New users are automatically registered on first sign-in.<br>
                Your Google account keeps your data secure.
            </p>

            <div class="form-message hidden" id="auth-msg"></div>
        </div>
    </div>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script src="session.js"></script>
    <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopDrop | Track Your Package</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>

        /* ── Track input row ──────────────────────────────────────────── */
        .track-hero {
            text-align: center; margin-bottom: 2rem;
        }
        .track-hero h2 { font-size: 1.6rem; margin-bottom: .4rem; }
        .track-hero p  { color: var(--text-muted); font-size: .92rem; }

        .track-row {
            display: flex; gap: .75rem; align-items: stretch; margin-bottom: 1rem; flex-wrap: wrap;
        }
        .track-row input {
            flex: 1; padding: .9rem 1.25rem;
            font-size: 1.1rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn-track {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; color: white; padding: .9rem 1.6rem; border-radius: 12px;
            font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap;
            transition: all .2s; flex-shrink: 0;
        }
        .btn-track:hover    { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(6,182,212,.3); }
        .btn-track:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* ── All-packages toggle ──────────────────────────────────────── */
        .all-pkgs-btn {
            width: 100%; background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1); color: var(--text-muted);
            padding: .6rem; border-radius: 10px; cursor: pointer; font-size: .85rem;
            transition: all .2s; margin-bottom: 1.5rem;
        }
        .all-pkgs-btn:hover { border-color: var(--secondary); color: var(--secondary); }

        /* ── Status timeline ─────────────────────────────────────────── */
        .timeline { display: flex; align-items: center; margin: 1.25rem 0; }
        .tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .tl-dot {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
            display: flex; align-items: center; justify-content: center;
            font-size: .85rem; transition: all .3s;
        }
        .tl-dot.done   { background: rgba(34,197,94,.2); border-color: var(--success); }
        .tl-dot.active { background: rgba(6,182,212,.2); border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(6,182,212,.15); }
        .tl-label { font-size: .72rem; color: var(--text-muted); margin-top: .4rem; font-weight: 600; text-align: center; }
        .tl-label.done   { color: var(--success); }
        .tl-label.active { color: var(--secondary); }
        .tl-line { flex: 1; height: 2px; background: rgba(255,255,255,.1); }
        .tl-line.done { background: var(--success); }

        /* ── Package card ─────────────────────────────────────────────── */
        .pkg-card {
            background: rgba(255,255,255,.05); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 1.5rem; margin-bottom: 1.25rem;
        }
        .pkg-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem; }
        .pkg-id-tag { font-size: .72rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); background: rgba(255,255,255,.07); padding: .25rem .65rem; border-radius: 6px; }

        .info-row { font-size: .9rem; margin-bottom: .4rem; line-height: 1.6; }
        .info-row span { color: var(--text-muted); }

        /* Status pill */
        .sp { display: inline-block; padding: .22rem .7rem; border-radius: 99px; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
        .sp-pending  { background: rgba(234,179,8,.15);  color: var(--warning); }
        .sp-accepted { background: rgba(6,182,212,.15);  color: var(--secondary); }
        .sp-delivered{ background: rgba(34,197,94,.15);  color: var(--success); }

        /* Proof photos */
        .proof-photos { display: flex; gap: 1rem; margin-top: .75rem; flex-wrap: wrap; }
        .proof-item { flex: 1; min-width: 120px; }
        .proof-item label { font-size: .75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: .35rem; }
        .proof-item img { width: 100%; border-radius: 10px; border: 1px solid var(--glass-border); object-fit: cover; max-height: 130px; }
        .proof-ph { background: rgba(255,255,255,.04); border: 1.5px dashed rgba(255,255,255,.12); border-radius: 10px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: .78rem; color: var(--text-muted); }

        /* Delivered banner */
        .delivered-banner {
            background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.25);
            border-radius: 12px; padding: 1rem; margin-top: .75rem; font-size: .9rem; line-height: 1.7;
        }

        /* ── Empty / Error state ─────────────────────────────────────── */
        .empty-state { text-align: center; color: var(--text-muted); padding: 2.5rem 0; }
        .empty-state .icon { font-size: 2.8rem; margin-bottom: .5rem; }

        /* ── Hint box ────────────────────────────────────────────────── */
        .hint-box { background: rgba(6,182,212,.06); border: 1px dashed rgba(6,182,212,.25); border-radius: 12px; padding: .85rem 1rem; font-size: .83rem; color: var(--secondary); line-height: 1.6; text-align: center; margin-bottom: 1.25rem; }
    </style>
</head>
<body>
<div class="animated-bg">
    <div class="orb orb-pink"></div>
    <div class="orb orb-blue"></div>
    <div class="orb orb-yellow"></div>
</div>

<div class="container glass-panel form-layout" style="max-width:680px;">
    <nav class="top-nav">
        <a href="index.html" class="back-link">← Back</a>
        <h1 class="logo">Hop<span>Drop</span></h1>
    </nav>
    <div id="user-bar"></div>

    <div class="track-hero">
        <h2>🎁 Track Your Package</h2>
        <p>Enter the Package ID sent to you via WhatsApp by the sender.</p>
    </div>

    <!-- ── Package ID input (primary) ───────────────────────────────── -->
    <div class="track-row">
        <input type="text" id="pkg-id-input"
            placeholder="e.g. A1B2C3D4"
            maxlength="8"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
        >
        <button class="btn-track" id="track-btn" onclick="trackById()">🔍 Track</button>
    </div>

    <div class="hint-box">
        💬 The Package ID was sent to you over WhatsApp when the sender created the package.
    </div>

    <!-- ── "View all my packages" secondary button ──────────────────── -->
    <button class="all-pkgs-btn" id="all-pkgs-btn" onclick="loadAllMyPackages()">
        📋 View all packages linked to my account
    </button>

    <!-- ── Results ──────────────────────────────────────────────────── -->
    <div id="results-area"></div>
</div>

<script src="session.js"></script>
<script>
const API = 'http://127.0.0.1:5000';

/* ── Session ──────────────────────────────────────────────────────────── */
const session = hdRequire('Receiver');
if (session) hdBar('user-bar');

/* ── Track by Package ID ─────────────────────────────────────────────── */
async function trackById() {
    const pkgId = document.getElementById('pkg-id-input').value.trim().toUpperCase();
    const btn   = document.getElementById('track-btn');
    const area  = document.getElementById('results-area');

    if (!pkgId || pkgId.length < 4) {
        area.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Please enter a valid Package ID.</p></div>`;
        return;
    }

    btn.disabled = true; btn.textContent = 'Tracking…';
    area.innerHTML = `<div class="empty-state"><div class="icon">⏳</div><p>Looking up package <strong>${pkgId}</strong>…</p></div>`;

    try {
        const res = await fetch(`${API}/package/${pkgId}`);
        if (res.status === 404) {
            area.innerHTML = `<div class="empty-state"><div class="icon">❌</div>
                <p>No package found with ID <strong>${pkgId}</strong>.<br>
                Double-check the ID in your WhatsApp message.</p></div>`;
        } else if (!res.ok) {
            throw new Error(`Server error ${res.status}`);
        } else {
            const pkg = await res.json();
            area.innerHTML = renderCard(pkg);
        }
    } catch (err) {
        area.innerHTML = `<div class="empty-state"><div class="icon">❌</div>
            <p>Cannot reach the server.<br>Make sure Flask is running on port 5000.</p></div>`;
    }

    btn.disabled = false; btn.textContent = '🔍 Track';
}

/* ── Load all packages for session phone ─────────────────────────────── */
async function loadAllMyPackages() {
    const area = document.getElementById('results-area');
    const btn  = document.getElementById('all-pkgs-btn');

    if (!session) {
        area.innerHTML = `<div class="empty-state"><div class="icon">🔒</div><p>Please log in to see your packages.</p></div>`;
        return;
    }

    btn.disabled = true; btn.textContent = 'Loading…';
    area.innerHTML = `<div class="empty-state"><div class="icon">⏳</div><p>Loading packages for ${session.phone}…</p></div>`;

    try {
        const res  = await fetch(`${API}/receiver-packages?phone=${encodeURIComponent(session.phone)}`);
        const pkgs = res.ok ? await res.json() : [];

        if (!pkgs.length) {
            area.innerHTML = `<div class="empty-state"><div class="icon">📭</div>
                <p>No packages linked to your phone <strong>${session.phone}</strong>.<br>
                Use the Package ID from WhatsApp to track specific packages.</p></div>`;
        } else {
            area.innerHTML = `
                <p style="color:var(--text-muted);font-size:.88rem;margin-bottom:1rem;">
                    Found <strong style="color:var(--text);">${pkgs.length}</strong> package(s) for ${session.phone}
                </p>
                ${pkgs.map(renderCard).join('')}`;
        }
    } catch(err) {
        area.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>Cannot reach the server.</p></div>`;
    }

    btn.disabled = false; btn.textContent = '📋 View all packages linked to my account';
}

/* ── Timeline HTML ────────────────────────────────────────────────────── */
function timeline(status) {
    const steps  = [
        { key: 'pending',   label: 'Created',  icon: '📦' },
        { key: 'accepted',  label: 'Picked Up', icon: '🚗' },
        { key: 'delivered', label: 'Delivered', icon: '🎁' },
    ];
    const order   = { pending: 0, accepted: 1, delivered: 2 };
    const current = order[status] ?? 0;
    let html = '<div class="timeline">';
    steps.forEach((s, i) => {
        const o      = order[s.key];
        const done   = o < current;
        const active = o === current;
        html += `<div class="tl-step">
            <div class="tl-dot ${done?'done':active?'active':''}">${s.icon}</div>
            <div class="tl-label ${done?'done':active?'active':''}">${s.label}</div>
        </div>`;
        if (i < steps.length - 1)
            html += `<div class="tl-line ${done?'done':''}"></div>`;
    });
    return html + '</div>';
}

/* ── Render a package card ────────────────────────────────────────────── */
function renderCard(p) {
    const sCls = { pending:'sp-pending', accepted:'sp-accepted', delivered:'sp-delivered' }[p.status] || 'sp-pending';

    const proofHtml = `
    <div class="proof-photos">
        <div class="proof-item">
            <label>📦 Package photo</label>
            ${p.package_photo ? `<img src="${p.package_photo}" alt="Package">` : `<div class="proof-ph">Not taken</div>`}
        </div>
        <div class="proof-item">
            <label>🚗 Pickup proof</label>
            ${p.pickup_photo  ? `<img src="${p.pickup_photo}"  alt="Pickup">` : `<div class="proof-ph">Pending pickup</div>`}
        </div>
        <div class="proof-item">
            <label>✅ Delivery proof</label>
            ${p.delivery_photo? `<img src="${p.delivery_photo}" alt="Delivery">`: `<div class="proof-ph">Pending delivery</div>`}
        </div>
    </div>`;

    const deliveredBanner = p.status === 'delivered' ? `
    <div class="delivered-banner">
        ✅ <strong>Your package has been delivered!</strong><br>
        Check the delivery proof photo above for confirmation.
    </div>` : '';

    return `
    <div class="pkg-card">
        <div class="pkg-card-top">
            <span class="pkg-id-tag">PKG # ${p.id}</span>
            <span class="sp ${sCls}">${p.status}</span>
        </div>
        ${timeline(p.status)}
        <div class="info-row"><span>📍 From:</span> ${p.sender_address}</div>
        <div class="info-row"><span>🏁 To:</span> ${p.receiver_address}</div>
        ${p.description ? `<div class="info-row"><span>📋 Item:</span> ${p.description}</div>` : ''}
        ${p.accepted_by  ? `<div class="info-row"><span>🚗 Traveller:</span> ${p.accepted_by}</div>` : ''}
        ${proofHtml}
        ${deliveredBanner}
    </div>`;
}

/* ── Enter key on input ───────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pkg-id-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') trackById();
    });
});
</script>
</body>
</html>
